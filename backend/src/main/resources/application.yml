spring:
  # Local .env is a Java .properties file; deployment environment wins.
  # Supports Spring Boot launched from repository root or backend/.
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  application:
    name: oys-elibrary
  datasource:
    url: ${OYS_DB_URL}
    username: ${OYS_DB_USER}
    password: ${OYS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # A real local Keycloak instance must be running on localhost:8180.
          # SecurityConfiguration's JwtDecoder validates issuer and audience.
          issuer-uri: ${OYS_JWT_ISSUER}
          jwk-set-uri: ${OYS_JWKS_URI}
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
oys:
  security:
    audience: ${OYS_JWT_AUDIENCE}
